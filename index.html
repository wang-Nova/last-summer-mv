<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>去年夏天 · 霓虹海风与夏日胶片动画 MV（原创 10 幕 · 122 BPM 卡点）</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="title-group">
        <span class="badge-summer" aria-hidden="true">夏</span>
        <div>
          <h1>去年夏天 <span class="sub">霓虹海风与电车胶片 MV · 原创 10 幕电影版</span></h1>
          <p class="desc">1280×720 纯前端 Canvas 电影级光影实时渲染 · 122.3 BPM 真实鼓点卡点</p>
        </div>
      </div>
      <div class="top-actions">
        <button id="modeVideoBtn" class="pill-btn" title="切换观看已渲染导出的带配乐高清成品视频">🎬 成品视频（带配乐）</button>
        <a id="downloadMp4Btn" class="pill-btn" href="last-summer-mv.mp4" download="last-summer-mv.mp4" title="下载带配乐高清 MP4 视频">⬇ 下载 MP4</a>
        <button id="beatSyncBtn" class="pill-btn active" title="切换 DJ 鼓点视觉卡点强度（默认柔和）">🥁 节奏卡点：柔和</button>
        <label class="pill-btn" title="导入本地 MP3/WAV/OGG 音频同步">
          <span>🎵 换音频</span>
          <input id="audioFileInput" type="file" accept="audio/*" hidden />
        </label>
        <button id="interactiveBtn" class="pill-btn" title="开启后点击画面放盛夏花火、撒荧光兰花瓣或放飞纸飞机">✨ 互动彩蛋：关</button>
        <button id="recordBtn" class="pill-btn" title="录制导出 WebM">⏺ 录制导出</button>
        <button id="fullscreenBtn" class="pill-btn" title="全屏观看 (F)">⛶ 全屏</button>
      </div>
    </header>

    <main class="stage-wrap">
      <div id="canvasFrame" class="canvas-frame">
        <canvas id="mvCanvas" width="1280" height="720"></canvas>
        <video id="mvVideo" class="mv-video hidden" controls playsinline preload="auto" poster="poster.png">
          <source src="last-summer-mv.webm" type="video/webm" />
          <source src="last-summer-mv.mp4" type="video/mp4" />
        </video>
        <div id="videoStatusBanner" class="video-status-banner hidden">
          <div id="videoStatusText" class="video-status-text"></div>
          <div class="video-status-actions">
            <button id="videoFallbackCanvasBtn" class="mini-btn gold">▶ 改用实时代码播放（含原曲配乐）</button>
            <button id="videoRetryBlobBtn" class="mini-btn">↻ 重新加载兼容流</button>
          </div>
        </div>
        <div id="startOverlay" class="start-overlay">
          <div class="start-card">
            <div class="start-badge">原创电影感胶片 MV · 01:19 · 122 BPM 鼓点卡点</div>
            <div class="start-title">去 年 夏 天</div>
            <p class="start-hint">雨夜霓虹磁带 · 盛夏积雨云电车 · 黄金海堤约定 · 海岸摩天轮烟花 · 四季空站台 · 素白兰花雨 · 破晓放飞纸飞机</p>
            <div class="start-actions">
              <button id="bigPlayBtn" class="big-play-btn">▶ 实时代码播放</button>
              <button id="bigVideoBtn" class="big-video-btn">🎬 播带配乐成品视频</button>
            </div>
          </div>
        </div>
        <div id="interactiveHint" class="interactive-hint hidden"></div>
      </div>

      <section class="controls-panel">
        <div class="transport-row">
          <button id="playPauseBtn" class="ctrl-btn primary" title="播放 / 暂停 (Space)">▶ 播放</button>
          <button id="restartBtn" class="ctrl-btn" title="重播">↺ 重播</button>
          <span id="beatLed" class="beat-led" title="122.3 BPM 实时鼓点指示灯">● 122 BPM</span>
          <span id="timeDisplay" class="time-display">00:00.0 / 01:19.0</span>

          <div class="scrubber-wrap">
            <input id="timelineSlider" type="range" min="0" max="79.00" step="0.02" value="0" />
            <div id="sceneTicks" class="scene-ticks"></div>
          </div>

          <div class="audio-controls">
            <button id="muteBtn" class="ctrl-btn" title="静音 / 取消静音">🔊</button>
            <select id="speedSelect" class="speed-select" title="播放倍速">
              <option value="0.5">0.5x</option>
              <option value="0.75">0.75x</option>
              <option value="1" selected>1.0x</option>
              <option value="1.25">1.25x</option>
              <option value="1.5">1.5x</option>
            </select>
            <label class="loop-toggle">
              <input id="loopCheck" type="checkbox" checked />
              <span>循环</span>
            </label>
          </div>
        </div>

        <div id="customAudioBar" class="custom-audio-bar hidden">
          <span id="audioFileName">已加载音频</span>
          <label class="offset-wrap">
            起始偏移：<input id="audioOffset" type="number" step="0.1" value="0" /> 秒
          </label>
          <button id="clearAudioBtn" class="mini-btn">切回内置原曲配乐</button>
        </div>

        <div id="scenePills" class="scene-pills"></div>
      </section>
    </main>
  </div>

  <script src="js/bgm-data.js"></script>
  <script src="js/beat-map.js"></script>
  <script src="js/visual-core.js"></script>
  <script src="js/scenes-part1.js"></script>
  <script src="js/scenes-part2.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
